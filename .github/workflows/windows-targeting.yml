name: Windows targeting and input

on:
  push:
    branches: [main, cursor/windows-key-sendkeys-99ad, codex/windows-click-tests]
  pull_request:
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:
    inputs:
      live_models:
        description: 'Also run two paid live model test cases using NUBBO_TEST_API_KEY'
        type: boolean
        default: false
      text_model:
        description: 'Explicit OpenRouter model ID for the live list test'
        type: string
        default: ''
      gui_model:
        description: 'Explicit OpenRouter model ID for the live screenshot test'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: windows-targeting-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop-probe:
    name: First verify a real Windows input desktop
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Capture and one native input event only
        env:
          NUBBO_PROBE_ONLY: '1'
          NUBBO_TEST_OUTPUT: out/windows-probe
        run: npm run test:desktop
      - name: Probe summary
        if: always()
        shell: pwsh
        run: |
          if (Test-Path 'out/windows-probe/summary.json') {
            Get-Content 'out/windows-probe/summary.json' -Raw >> $env:GITHUB_STEP_SUMMARY
          } else {
            'Probe did not execute; dependency/setup step failed.' >> $env:GITHUB_STEP_SUMMARY
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: windows-desktop-probe
          path: out/windows-probe/
          if-no-files-found: warn
          retention-days: 14
  windows:
    name: ${{ matrix.os }} / real desktop
    needs: desktop-probe
    # The initial feature-branch push probes capability first. PRs and main run
    # the complete suite after a successful probe.
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Existing Vitest tests (including Windows branches)
        run: npm test
      - name: Existing Node regression tests
        run: |
          npm run test:keys
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:input
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:recovery
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:stability
          exit $LASTEXITCODE
      - name: Target selection and recorded-response regression tests
        run: npm run test:targeting
      - name: PowerShell 5.1 and PowerShell 7 worker tests (mock input)
        run: |
          foreach ($engine in @('powershell.exe', 'pwsh.exe')) {
            foreach ($script in @('test-worker.ps1', 'test-key-input.ps1', 'test-stability-worker.ps1', 'test-input-recovery.ps1', 'test-window-list.ps1')) {
              & $engine -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "scripts/$script"
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
          }
      - name: Build Electron
        run: npm run build:electron
      - name: Real desktop target and input tests (no API key)
        env:
          NUBBO_TEST_OUTPUT: out/windows-desktop
        run: npm run test:desktop
      - name: Native Windows shortcuts and independent shell observations
        run: powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts/test-windows-finish.ps1 -Mode Keys -Output out/windows-desktop/finish
      - name: Desktop coverage summary
        if: always()
        run: |
          if (Test-Path 'out/windows-desktop/summary.json') {
            $report = Get-Content 'out/windows-desktop/summary.json' -Raw | ConvertFrom-Json
            "## Desktop outcome: $($report.status)" >> $env:GITHUB_STEP_SUMMARY
            foreach ($result in $report.results) {
              "- $($result.status): $($result.name) $($result.message)" >> $env:GITHUB_STEP_SUMMARY
            }
            "`n### Not covered" >> $env:GITHUB_STEP_SUMMARY
            foreach ($item in $report.notCovered) { "- $item" >> $env:GITHUB_STEP_SUMMARY }
          } else {
            'Desktop tests did not run; earlier step failed. This is not desktop validation.' >> $env:GITHUB_STEP_SUMMARY
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: desktop-evidence-${{ matrix.os }}
          path: out/windows-desktop/
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        if: matrix.os == 'windows-2022'
        with:
          python-version: '3.13'
      - name: Portable EXE build (after successful tests)
        if: matrix.os == 'windows-2022'
        run: |
          python -m pip install 'Pillow==11.3.0'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run pack:win
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-FileHash 'release/Nubbo.exe' -Algorithm SHA256 | Format-List | Out-File 'release/Nubbo.sha256.txt'
      - name: Launch the actual portable EXE and verify its renderer
        if: matrix.os == 'windows-2022'
        run: powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts/test-windows-finish.ps1 -Mode Package -Output out/portable-smoke
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && matrix.os == 'windows-2022'
        with:
          name: portable-startup-evidence
          path: out/portable-smoke/
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: matrix.os == 'windows-2022'
        with:
          name: Nubbo-tested-windows-x64
          path: |
            release/Nubbo.exe
            release/Nubbo.sha256.txt
          if-no-files-found: error
          retention-days: 14

  live-models:
    name: Opt-in live model accuracy
    needs: desktop-probe
    if: github.event_name == 'workflow_dispatch' && inputs.live_models
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Real click tests plus explicitly requested live models
        env:
          NUBBO_RUN_LIVE_MODELS: '1'
          NUBBO_TEST_API_KEY: ${{ secrets.NUBBO_TEST_API_KEY }}
          NUBBO_TEST_TEXT_MODEL: ${{ inputs.text_model }}
          NUBBO_TEST_GUI_MODEL: ${{ inputs.gui_model }}
          NUBBO_TEST_OUTPUT: out/windows-live-models
        run: npm run test:desktop
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: live-model-evidence
          path: out/windows-live-models/
          if-no-files-found: warn
          retention-days: 14

  main-verification:
    name: Exact main after merge / native smoke
    if: (github.event_name == 'pull_request' && github.base_ref == 'main') || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: windows-2022
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
        working-directory: main-under-test
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          path: harness
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: main
          path: main-under-test
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - name: Record exact main revision
        run: |
          $revision = git rev-parse HEAD
          "NUBBO_MAIN_SHA=$revision" >> $env:GITHUB_ENV
          "Main under test: $revision (production sources not overlaid)" >> $env:GITHUB_STEP_SUMMARY
      - name: Main's own dependency install and tests
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($task in @('typecheck','test','test:keys','test:input','test:recovery','test:stability','build:electron')) {
            npm run $task
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Copy test fixture only and test actual main native input
        run: |
          Copy-Item '../harness/scripts/windows-main-smoke.cjs' 'main-desktop-test.cjs'
          New-Item -ItemType Directory -Force 'scripts/windows' | Out-Null
          Copy-Item '../harness/scripts/windows/ClickTestHost.cs' 'scripts/windows/ClickTestHost.cs'
          Copy-Item '../harness/scripts/windows/build-host.ps1' 'scripts/windows/build-host.ps1'
          Remove-Item Env:ELECTRON_RUN_AS_NODE -ErrorAction SilentlyContinue
          & './node_modules/.bin/electron.cmd' './main-desktop-test.cjs'
          exit $LASTEXITCODE
      - name: Actual main report
        if: always()
        run: |
          if (Test-Path 'out/main-desktop/summary.json') { Get-Content 'out/main-desktop/summary.json' -Raw >> $env:GITHUB_STEP_SUMMARY }
          else { 'Main native tests did not execute; do not count as passed.' >> $env:GITHUB_STEP_SUMMARY }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: exact-main-desktop-evidence
          path: main-under-test/out/main-desktop/
          if-no-files-found: warn
          retention-days: 14
